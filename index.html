<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbeitssicherheit Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        
        .loading {
            color: white;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow"></div>
    <div class="info">
        <span id="current">1</span> / <span id="total">0</span>
    </div>

    <script>
        var IMAGE_URLS = [
            "DEIN_BILD_LINK_HIER"
        ];
        
        var SLIDE_DURATION = 30000;
        var currentSlide = 0;

        function displaySlide() {
            if (IMAGE_URLS.length === 0) {
                document.getElementById("slideshow").innerHTML = 
                    '<div class="loading"><h2>Keine Bilder konfiguriert!</h2></div>';
                return;
            }
            
            var container = document.getElementById("slideshow");
            container.innerHTML = '<img src="' + IMAGE_URLS[currentSlide] + '" alt="Slide">';
            document.getElementById("current").textContent = currentSlide + 1;
            document.getElementById("total").textContent = IMAGE_URLS.length;
        }

        if (IMAGE_URLS.length > 0) {
            displaySlide();
            setInterval(function() {
                currentSlide = (currentSlide + 1) % IMAGE_URLS.length;
                displaySlide();
            }, SLIDE_DURATION);
        } else {
            displaySlide();
        }
    </script>
</body>
</html>
