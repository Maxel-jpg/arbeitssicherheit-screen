<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbeitssicherheit Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        
        .loading {
            color: white;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow"></div>
    <div class="info">
        <span id="current">1</span> / <span id="total">0</span>
    </div>

    <script>
        // ===== HIER MUSST DU DEINE BILD-URLS EINTRAGEN! =====
        // Beispiel: Lade Bilder direkt aus OneDrive mit ?download=1
        
        const IMAGE_URLS = [
            "https://siemens-my.sharepoint.com/:i:/r/personal/maximilian_haep_siemens_com/Documents/Sicherheitsbilder-Screen/csm_Siemens-Vectron_2.000_OEBB_5852ebdd28.jpg?d=wf7481459082b4312a451e51c8bdf267b&csf=1&web=1&e=DoygMg"
        ];
        
        const SLIDE_DURATION = 30000; // 30 Sekunden pro Bild
        
        let currentSlide = 0;

        function displaySlide() {
            if (IMAGE_URLS.length === 0) {
                document.getElementById("slideshow").innerHTML = 
                    '<div class="loading"><h2>Keine Bilder konfiguriert!</h2><p>Bitte Bild-URLs in der HTML-Datei eintragen.</p></div>';
                return;
            }
            
            const container = document.getElementById("slideshow");
            container.innerHTML = `<img src="${IMAGE_URLS[currentSlide]}" alt="Slide ${currentSlide + 1}">`;
            document.getElementById("current").textContent = currentSlide + 1;
            document.getElementById("total").textContent = IMAGE_URLS.length;
        }

        // Slideshow starten
        if (IMAGE_URLS.length > 0) {
            displaySlide();
            
            setInterval(() => {
                currentSlide = (currentSlide + 1) % IMAGE_URLS.length;
                displaySlide();
            }, SLIDE_DURATION);
        } else {
            displaySlide();
        }
    </script>
</body>
</html>
